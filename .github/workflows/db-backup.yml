# Weekly encrypted pg_dump of the production database, kept as a workflow
# artifact for 90 days (the maximum for a public repo).
#
# This repo is public, and artifacts on public repos can be downloaded by any
# signed-in GitHub user, so the dump is encrypted before upload.
#
# Required repository secrets:
#   BACKUP_DATABASE_URL  Neon *direct* (non "-pooler") connection string.
#                        pg_dump through PgBouncer is unreliable.
#   BACKUP_PASSPHRASE    Long random passphrase. Keep a copy outside GitHub
#                        (password manager), or the backups are unrecoverable.
#
# Restore:
#   gpg --decrypt books-YYYY-MM-DD.dump.gpg > books.dump
#   pg_restore --no-owner --no-privileges --clean --if-exists -d "$DATABASE_URL" books.dump

name: DB Backup
on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # for the keepalive step below
    steps:
      - name: Install PostgreSQL 18 client
        # pg_dump must be at least the server's major version; the runner's
        # preinstalled client lags Neon's default.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "BACKUP_DATABASE_URL is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set"; exit 1; }
          PGBIN=/usr/lib/postgresql/18/bin
          OUT="books-$(date -u +%F).dump"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

          "$PGBIN/pg_dump" --format=custom --no-owner --no-privileges \
            --dbname="$DATABASE_URL" --file="$OUT"

          # Sanity check: the archive is readable and contains the books table.
          "$PGBIN/pg_restore" --list "$OUT" | grep -q 'TABLE public books'

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 --output "$OUT.gpg" "$OUT"
          rm "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}.gpg
          path: ${{ env.OUT }}.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Keep schedule alive
        # GitHub disables scheduled workflows on public repos after 60 days
        # without repository activity. Re-enabling resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/db-backup.yml/enable"
