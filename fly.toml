# fly.toml app configuration file generated for books-tracker on 2026-01-14T20:28:21-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'books-tracker'
primary_region = 'sjc'

[build]

[deploy]
  release_command = 'node init-db.js'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  # Single user, a few visits a month: stop the machine when idle and boot it
  # on the next request (a few seconds of cold start) instead of paying for an
  # always-on VM. Nothing in the backend runs on a timer, so stopping is safe.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
